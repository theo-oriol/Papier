# Model hyperparameters, protocole §1. Frozen backbone except the LoRA
# adapters; everything here is trained from scratch (attention, both heads).
backbone:
  name: dinov3_vits16   # switched from vitl16 on 2026-09-23: vitl16 was already
                          # fully GPU-compute-saturated at micro_batch_size=1
                          # (measured, see optim.yaml), ~1 sac/s -> ~8h/epoch;
                          # vits16 trades backbone capacity for speed.
  lora:
    r: 8
    alpha: 18
    dropout: 0.05
    target_modules: [attn.qkv, attn.proj]   # every block, matched by suffix
feat_dim: 384          # DINOv3-S (ViT-S/16) embedding size - must match the
                        # backbone above (see model/bagmodel.py, feat_dim sizes
                        # the pooling/heads layers, not derived from the backbone)
num_habitats: 10
head_dropout: 0.1
