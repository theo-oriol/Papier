# DINOv3 backbones: local torch.hub checkout + pretrained weights, same
# pattern already used in bird_project/src/models/backbone.py. One entry per
# backbone_name that configs/model_{s,l,h}.yaml can select (src/model/
# backbone.py looks this dict up by cfg["backbone"]["name"]).
# dinov3_vits16 (S, embed_dim=384) and dinov3_vit7b16 (the 7B "giant" model,
# embed_dim=4096 - used here as the "H" tier since the real dinov3_vith16plus,
# embed_dim=1280, has no weights downloaded on this machine) added 2026-09-17.
dinov3_repo: /home/oriol@newcefe.newage.fr/Models/dinov3
dinov3_weights:
  dinov3_vits16: /media/oriol@newcefe.newage.fr/LaCie/weights/dinov3_vits16.pth
  dinov3_vitl16: /media/oriol@newcefe.newage.fr/LaCie/weights/dinov3_vitl16_pretrain_lvd1689m-8aa4cbdd.pth
  dinov3_vit7b16: /media/oriol@newcefe.newage.fr/LaCie/weights/dinov3_vit7b16_pretrain_lvd1689m-a955f4ea.pth

